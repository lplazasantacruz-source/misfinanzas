<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MisFinanzas">
<title>MisFinanzas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f0f13;
  --bg2: #16161d;
  --bg3: #1e1e28;
  --bg4: #26263a;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f4;
  --text2: #9090a8;
  --text3: #5a5a72;
  --accent: #7c6ff7;
  --accent2: #a89df9;
  --green: #3ecf8e;
  --green2: #1a7a50;
  --red: #f87171;
  --red2: #7a2828;
  --amber: #fbbf24;
  --blue: #60a5fa;
  --teal: #2dd4bf;
  --pink: #f472b6;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --r: 12px;
  --r2: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }

.owner-btn { padding: 5px 10px; font-size: 12px; font-weight: 500; font-family: var(--font); color: var(--text2); background: transparent; border: none; border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.owner-btn:hover { background: var(--bg4); color: var(--text); }
.owner-btn.active { background: var(--bg2); color: var(--accent2); }

/* LAYOUT */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 220px; min-width: 220px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 0; transition: transform 0.3s; }
#main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

/* SIDEBAR */
.logo { padding: 0 20px 28px; }
.logo-mark { font-size: 20px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; }
.logo-mark span { color: var(--accent2); }
.logo-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.nav-group { padding: 0 12px; margin-bottom: 4px; }
.nav-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r2); cursor: pointer; color: var(--text2); font-size: 14px; transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(124,111,247,0.15); color: var(--accent2); }
.nav-icon { width: 18px; height: 18px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active .nav-icon { opacity: 1; }
.sidebar-bottom { margin-top: auto; padding: 0 12px; }

/* HEADER */
#topbar { padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; z-index: 10; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 14px; }
.month-btn:hover { background: var(--bg4); color: var(--text); }
.month-label { font-size: 14px; color: var(--text); font-weight: 500; min-width: 110px; text-align: center; }

/* CONTENT */
#content { padding: 24px 28px; flex: 1; }

/* CARDS */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
.card-sm { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.metric-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.metric-value { font-size: 26px; font-weight: 600; color: var(--text); letter-spacing: -0.5px; font-family: var(--mono); }
.metric-sub { font-size: 12px; margin-top: 4px; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.muted { color: var(--text3); }
.card-title { font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.06em; }

/* UPLOAD */
.upload-zone { border: 1.5px dashed var(--border2); border-radius: var(--r); padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
.upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(124,111,247,0.05); }
.upload-icon { font-size: 32px; margin-bottom: 10px; }
.upload-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.upload-sub { font-size: 13px; color: var(--text3); }
.upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.bank-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.bank-tag { font-size: 11px; padding: 3px 9px; border-radius: 20px; background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

/* TRANSACTIONS */
.txn-list { display: flex; flex-direction: column; gap: 1px; }
.txn-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r2); transition: background 0.1s; cursor: pointer; }
.txn-item:hover { background: var(--bg3); }
.txn-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.txn-desc { flex: 1; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.txn-cat { font-size: 11px; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
.txn-amount { font-size: 14px; font-family: var(--mono); font-weight: 500; min-width: 80px; text-align: right; flex-shrink: 0; }
.txn-date { font-size: 12px; color: var(--text3); min-width: 55px; text-align: right; flex-shrink: 0; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r2); font-size: 13px; font-weight: 500; font-family: var(--font); cursor: pointer; border: none; transition: all 0.15s; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent2); }
.btn-ghost { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg4); color: var(--text); }
.btn-danger { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
.btn-danger:hover { background: rgba(248,113,113,0.25); }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--r); padding: 28px; min-width: 360px; max-width: 500px; width: 90%; }
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* FORM ELEMENTS */
label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 6px; }
input, select { width: 100%; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); font-family: var(--font); font-size: 14px; padding: 9px 12px; border-radius: var(--r2); outline: none; transition: border 0.15s; }
input:focus, select:focus { border-color: var(--accent); }
select option { background: var(--bg3); }
.form-row { margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* PROGRESS BAR */
.progress-track { height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

/* CATEGORY PILL */
.cat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: 1.5px solid transparent; }

/* SECTION TITLE */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-size: 16px; font-weight: 600; }

/* BADGE */
.badge { font-size: 11px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }

/* TABS */
.tabs { display: flex; gap: 4px; background: var(--bg3); border-radius: var(--r2); padding: 3px; margin-bottom: 20px; }
.tab { flex: 1; padding: 7px; text-align: center; font-size: 13px; cursor: pointer; border-radius: 6px; color: var(--text2); transition: all 0.15s; }
.tab.active { background: var(--bg2); color: var(--text); font-weight: 500; }

/* PLAN TIMELINE */
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item { display: flex; gap: 16px; padding-bottom: 24px; position: relative; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-line { width: 1px; background: var(--border); position: absolute; left: 11px; top: 24px; bottom: 0; }
.timeline-dot { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; z-index: 1; }
.timeline-content { flex: 1; padding-top: 2px; }
.timeline-month { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
.timeline-desc { font-size: 13px; color: var(--text2); }

/* EMPTY STATE */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-title { font-size: 16px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }

/* NOTIFICATION */
.notif { position: fixed; bottom: 24px; right: 24px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--r); padding: 14px 18px; font-size: 14px; z-index: 200; transform: translateY(80px); opacity: 0; transition: all 0.3s; max-width: 320px; }
.notif.show { transform: translateY(0); opacity: 1; }

/* HAMBURGER (mobile) */
#hamburger { display: none; background: none; border: none; color: var(--text); cursor: pointer; padding: 4px; }

/* SAVINGS GOAL */
.goal-card { background: linear-gradient(135deg, rgba(124,111,247,0.1), rgba(62,207,142,0.08)); border: 1px solid rgba(124,111,247,0.25); border-radius: var(--r); padding: 20px; }

/* CHART wrapper */
.chart-wrap { position: relative; }

/* SCROLL AREA for txns */
.txn-scroll { max-height: 380px; overflow-y: auto; }

@media (max-width: 768px) {
  #sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 50; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); }
  #hamburger { display: flex; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  #content { padding: 16px; }
  #topbar { padding: 14px 16px; }
  .metric-value { font-size: 20px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="logo">
      <div class="logo-mark">Mis<span>Finanzas</span></div>
      <div class="logo-sub">Gestión familiar</div>
    </div>
    <div class="nav-group">

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">

        </button>
        <span class="page-title" id="pageTitle">Resumen</span>

    <div id="content"></div>

</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">

<div class="notif" id="notif"></div>

// ===================== CATEGORIZE =====================
function categorize(desc, amount) {
  const d = (desc || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const isIncome = amount === undefined ? false : amount > 0;

  if (isIncome) {
    // Only match income categories for positive amounts
    const incomeOrder = ['ing_trabajo', 'ing_bizum', 'ing_boda', 'ingresos'];
    for (const id of incomeOrder) {
      const cat = state.categories.find(c => c.id === id);
      if (!cat) continue;
      for (const kw of cat.keywords) {
        if (d.includes(kw)) return cat.id;
      }
    }
    return 'ingresos'; // default for unmatched income
  } else {
    // Only match expense categories for negative/zero amounts
    for (const cat of state.categories) {
      if (isIncomeCategory(cat.id) || cat.id === 'otros') continue;
      for (const kw of cat.keywords) {
        if (d.includes(kw)) return cat.id;
      }
    }
    return 'otros';
  }
}

function categorizeWithRules(desc, account, amount) {
  for (const rule of (state.rules || [])) {
    if (rule.account && rule.account !== account) continue;
    if (rule.amtMin !== '' && rule.amtMin !== null && amount > rule.amtMin) continue;
    if (rule.amtMax !== '' && rule.amtMax !== null && amount < rule.amtMax) continue;
    if (rule.descContains) {
      const d = (desc||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (!d.includes(rule.descContains.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))) continue;
    }
    return rule.catId;
  }
  return categorize(desc, amount);
}

function isIncomeCategory(catId) {
  if (!catId) return false;
  // Any category starting with 'ing_' is income
  if (catId.startsWith('ing_')) return true;
  // Legacy income category id
  if (catId === 'ingresos') return true;
  // Check income flag on saved category
  const cat = state.categories.find(c => c.id === catId);
  return cat ? !!cat.income : false;
}

function getCat(id) { return state.categories.find(c => c.id === id) || state.categories[state.categories.length-1]; }

function detectBank(filename, rows, accountId) {
  // accountId is now the primary signal — trust it
  if (accountId === 'revolut')         return 'revolut';
  if (accountId === 'openbank')        return 'openbank';
  if (accountId === 'santander')       return 'santander';
  if (accountId === 'unicaja_tarjeta') return 'unicaja_tarjeta';
  if (accountId === 'unicaja_cuenta')  return 'unicaja_cuenta';
  // Fallback: sniff content
  const fn = filename.toLowerCase();
  if (fn.includes('revolut') || fn.includes('account-statement')) return 'revolut';
  const allText = rows.slice(0,10).map(r => (r||[]).join(' ')).join(' ').toLowerCase();
  if (fn.includes('tarjeta') || allText.includes('nombre comercio')) return 'unicaja_tarjeta';
  if (allText.includes('cuenta online santander') || allText.includes('0049 6096')) return 'openbank';
  if (allText.includes('2103 4677') || allText.includes('movimientos en cuenta')) return 'santander';
  return 'unicaja_cuenta';
}

function parseAmt(v) {
  if (v === '' || v === null || v === undefined) return null;
  if (typeof v === 'number') return isNaN(v) ? null : v;
  const s = String(v).trim().replace(/\s/g,'').replace(/€/g,'');
  let n;
  // European thousands format: 1.234 or 1.234,56
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
    n = parseFloat(s.replace(/\./g,'').replace(',','.'));
  } else if (/,/.test(s) && /\./.test(s)) {
    // Both separators: last one is decimal
    const lastDot   = s.lastIndexOf('.');
    const lastComma = s.lastIndexOf(',');
    if (lastComma > lastDot) n = parseFloat(s.replace(/\./g,'').replace(',','.'));
    else                     n = parseFloat(s.replace(/,/g,''));
  } else if (/,/.test(s)) {
    // Only comma → decimal separator (European)
    n = parseFloat(s.replace(',','.'));
  } else {
    n = parseFloat(s);
  }
  return isNaN(n) ? null : n;
}

function parseDate(v) {
  if (!v) return '';
  if (v instanceof Date) return v.toISOString().slice(0,10);
  // Numeric Excel serial (e.g. 46127)
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  // dd/mm/yyyy or dd-mm-yyyy
  const m1 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m1) { const y = m1[3].length===2?'20'+m1[3]:m1[3]; return `${y}-${m1[2].padStart(2,'0')}-${m1[1].padStart(2,'0')}`; }
  // yyyy-mm-dd
  const m2 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
  if (m2) return `${m2[1]}-${m2[2].padStart(2,'0')}-${m2[3].padStart(2,'0')}`;
  // 5-digit string serial
  if (/^\d{5}$/.test(s)) {
    const d = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
    return d.toISOString().slice(0,10);
  }
  return new Date().toISOString().slice(0,10);
}

function makeTxn(date, desc, amount, account, extraId) {
  const acc = ACCOUNTS.find(a => a.id === account) || ACCOUNTS[0];
  return {
    id: Date.now() + '_' + extraId + '_' + Math.random().toString(36).slice(2),
    date, desc: desc.trim(),
    amount,
    cat: categorizeWithRules(desc, account, amount),
    account: account,
    owner: acc.owner
  };
}

function addTxns(txnList) {
  for (const t of txnList) {
    if (!t.date || (t.amount === 0 && !t.desc)) continue;
    const key = t.date.slice(0,7);
    if (!state.months[key]) state.months[key] = { transactions: [] };
    const exists = state.months[key].transactions.some(x =>
      x.date === t.date && x.desc === t.desc && x.amount === t.amount && x.account === t.account
    );
    if (!exists) state.months[key].transactions.push(t);
  }
}

// ===================== PARSERS =====================
// Verified structure for each bank:
//
// REVOLUT     → CSV, cols: Type(0) Started Date(2) Description(4) Amount(5) State(8)
// SANTANDER   → XLS real, header row 7: FECHA OPERACIÓN(0) CONCEPTO(2) IMPORTE EUR(3)
//               dates=text "dd/mm/yyyy", amounts=numbers
// UNICAJA CTA → XLS real, header row 10: Fecha de operación(0) Concepto(2) Importe(3)
//               dates=Excel serial (ctype=3), amounts=numbers. Skip REC.MCARD.
// UNICAJA TAR → XLS real, header row 10: Fecha operación(0) Nombre comercio(2) Importe(4)
//               dates=text "dd/mm/yyyy", amounts=text "-280,91" (European)
// OPENBANK    → HTML file (.xls extension). Header row TR10: Fecha Operación(0) Concepto(2) Importe(3)
//               dates=text "dd/mm/yyyy", amounts=text "-1.000,00" (European)

function parseCSVLine(line) {
  const cols = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { cols.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  cols.push(cur.trim());
  return cols;
}

function parseRevolut(text, account) {
  // Header: Type,Product,Started Date,Completed Date,Description,Amount,Fee,Currency,State,Balance
  // Some descriptions contain commas inside quotes: "Repsol, S.L.U. - ..."
  // Must use proper CSV parsing, not simple split(',')
  const txns = [];
  const lines = text.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = parseCSVLine(line);
    if (cols.length < 9) continue;
    if (cols[8] !== 'COMPLETED') continue;
    const date = parseDate(cols[2]);  // Started Date: "2026-01-02 01:00:00"
    const desc = cols[4] || 'Revolut';
    const amt  = parseFloat(cols[5]);
    if (!date || isNaN(amt)) continue;
    txns.push(makeTxn(date, desc, amt, account, i));
  }
  console.log(`[revolut] ${txns.length} transacciones`);
  return txns;
}

function parseSantander(rows, account) {
  // Header row 7 (index 7): FECHA OPERACIÓN(0) | FECHA VALOR(1) | CONCEPTO(2) | IMPORTE EUR(3) | SALDO(4)
  // Data from row 8 onwards. Dates = text "dd/mm/yyyy". Amounts = JS numbers.
  const txns = [];
  let hRow = -1;
  for (let i = 0; i < Math.min(12, rows.length); i++) {
    if (!rows[i]) continue;
    const txt = rows[i].map(c => String(c||'').toLowerCase()).join('');
    if (txt.includes('concepto') && txt.includes('importe')) { hRow = i; break; }
  }
  if (hRow < 0) { console.warn('[santander] cabecera no encontrada'); return txns; }

  for (let i = hRow + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row[0] == null || row[0] === '') continue;
    const date    = parseDate(row[0]);   // text "dd/mm/yyyy"
    const desc    = String(row[2]||'').trim();
    const amt     = parseAmt(row[3]);    // JS number
    if (!date || !desc || amt === null) continue;
    txns.push(makeTxn(date, desc, amt, account, i));
  }
  console.log(`[santander] hRow=${hRow}, ${txns.length} transacciones`);
  return txns;
}

function parseUnicajaCuenta(rows, account) {
  // Header row 10: Fecha de operación(0) | Fecha valor(1) | Concepto(2) | Importe(3) | ...
  // Data from row 11. Dates = Excel date serial (number). Amounts = JS numbers.
  // Skip REC.MCARD (those are covered by Unicaja Tarjeta file).
  const txns = [];
  let hRow = -1;
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    if (!rows[i]) continue;
    const txt = rows[i].map(c => String(c||'').toLowerCase()).join('');
    if (txt.includes('concepto') && txt.includes('importe')) { hRow = i; break; }
  }
  if (hRow < 0) { console.warn('[unicaja_cuenta] cabecera no encontrada'); return txns; }

  for (let i = hRow + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row[0] == null || row[0] === '') continue;
    const desc = String(row[2]||'').trim();
    if (!desc || /^REC\./i.test(desc)) continue;
    const date = parseDate(row[0]);   // Date object (cellDates:true) or serial number
    const amt  = parseAmt(row[3]);    // JS number
    if (!date || amt === null) continue;
    txns.push(makeTxn(date, desc, amt, account, i));
  }
  console.log(`[unicaja_cuenta] hRow=${hRow}, ${txns.length} transacciones`);
  return txns;
}

function parseUnicajaTarjeta(rows, account) {
  // Header row 10: Fecha operación(0) | Hora(1) | Nombre comercio(2) | Concepto(3) | Importe(4) | Divisa(5)
  // Data from row 11. Dates = text "dd/mm/yyyy". Amounts = text "-280,91" (European string).
  const txns = [];
  let hRow = -1;
  for (let i = 0; i < Math.min(15, rows.length); i++) {
    if (!rows[i]) continue;
    const txt = rows[i].map(c => String(c||'').toLowerCase()).join('');
    if (txt.includes('nombre comercio')) { hRow = i; break; }
  }
  if (hRow < 0) { console.warn('[unicaja_tarjeta] cabecera no encontrada'); return txns; }

  for (let i = hRow + 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row[0] == null || row[0] === '') continue;
    const date     = parseDate(row[0]);   // text "dd/mm/yyyy"
    const comercio = String(row[2]||'').trim();
    const amt      = parseAmt(row[4]);    // text "-280,91"
    if (!date || amt === null) continue;
    txns.push(makeTxn(date, comercio || 'Tarjeta Unicaja', amt, account, i));
  }
  console.log(`[unicaja_tarjeta] hRow=${hRow}, ${txns.length} transacciones`);
  return txns;
}

function parseOpenbankHTML(htmlText, account) {
  // HTML file. Header TR has sparse columns with empty cells between data cells:
  // ["","Fecha Operación","","Fecha Valor","","Concepto","","Importe","","Saldo"]
  // So we must detect column indices from the header text, not assume fixed positions.
  // Amounts = text "-1.000,00" (European string with thousands dot).
  const txns = [];
  try {
    const doc  = new DOMParser().parseFromString(htmlText, 'text/html');
    const trs  = Array.from(doc.querySelectorAll('tr'));
    let hRow   = -1;
    for (let i = 0; i < trs.length; i++) {
      const t = trs[i].textContent.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if (t.includes('concepto') && t.includes('importe')) { hRow = i; break; }
    }
    if (hRow < 0) { console.warn('[openbank] cabecera HTML no encontrada'); return txns; }

    // Detect column indices from header cells
    const hCells = Array.from(trs[hRow].querySelectorAll('td,th'))
      .map(td => td.textContent.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
    console.log('[openbank] header cells:', hCells);

    const dC = hCells.findIndex(h => h.includes('fecha') && (h.includes('operac') || h === 'fecha operacion'));
    const xC = hCells.findIndex(h => h.includes('concepto'));
    const aC = hCells.findIndex(h => h.includes('importe'));
    console.log(`[openbank] cols: fecha=${dC} concepto=${xC} importe=${aC}`);

    if (dC < 0 || xC < 0 || aC < 0) {
      console.warn('[openbank] no se encontraron columnas en cabecera');
      return txns;
    }

    for (let i = hRow + 1; i < trs.length; i++) {
      const cells = Array.from(trs[i].querySelectorAll('td,th')).map(td => td.textContent.trim());
      if (cells.length <= Math.max(dC, xC, aC)) continue;
      const date = parseDate(cells[dC]);
      const desc = cells[xC] || '';
      const amt  = parseAmt(cells[aC]);
      if (!date || !desc || amt === null) continue;
      txns.push(makeTxn(date, desc, amt, account, i));
    }
    console.log(`[openbank] ${txns.length} transacciones`);
  } catch(e) {
    console.error('[openbank] Error HTML:', e);
  }
  return txns;
}

function parseExcel(file, accountId) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        let txns = [];
        const isCSV     = file.name.toLowerCase().endsWith('.csv');
        const isOpenbank = accountId === 'openbank';

        if (isCSV) {
          // Revolut CSV — already a string from readAsText
          txns = parseRevolut(e.target.result, accountId);

        } else if (isOpenbank) {
          // Openbank HTML file — already read as iso-8859-1 text
          txns = parseOpenbankHTML(e.target.result, accountId);

        } else {
          // Real XLS: Santander, Unicaja Cuenta, Unicaja Tarjeta
          // Use cellDates:true so Excel date serials become JS Date objects
          const wb   = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
          const ws   = wb.Sheets[wb.SheetNames[0]];
          // raw:false → numbers stay numbers, dates become Date objects, text stays text
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: false });
          console.log(`[${accountId}] ${file.name}: ${rows.length} filas, row[10]=`, rows[10]);

          if      (accountId === 'santander')       txns = parseSantander(rows, accountId);
          else if (accountId === 'unicaja_cuenta')  txns = parseUnicajaCuenta(rows, accountId);
          else if (accountId === 'unicaja_tarjeta') txns = parseUnicajaTarjeta(rows, accountId);
        }

        if (txns.length === 0) {
          showNotif('⚠️ 0 transacciones leídas. Comprueba en F12 > Console qué dice el parser.', 6000);
        } else {
          addTxns(txns);
          for (const k of Object.keys(state.months)) {
            state.months[k].transactions.sort((a,b) => b.date.localeCompare(a.date));
          }
          state.lastUpdated = new Date().toISOString();
          saveState();
          updateLastUpdatedLabel();
        }
        resolve(txns.length);
      } catch(err) {
        console.error('[parseExcel] Error:', err);
        showNotif('❌ Error: ' + err.message, 6000);
        resolve(0);
      }
    };

    if (file.name.toLowerCase().endsWith('.csv') || accountId === 'openbank') {
      reader.readAsText(file, 'iso-8859-1');
    } else {
      reader.readAsBinaryString(file);
    }
  });
}

function filterTxnsByOwner(txns, ownerFilter) {
  if (!ownerFilter || ownerFilter === 'todas') return txns;
  if (ownerFilter === 'laura')  return txns.filter(t => t.owner === 'laura');
  if (ownerFilter === 'miguel') return txns.filter(t => t.owner === 'miguel');
  if (ownerFilter === 'ambos')  return txns.filter(t => t.owner === 'ambos');
  return txns;
}

function calcStats(txns) {
  let ingresos = 0, gastos = 0;
  const byCat = {};
  const byIngCat = {};
  for (const t of txns) {
    if (t.amount > 0) {
      ingresos += t.amount;
      const c = t.cat || 'ingresos';
      const ingKey = isIncomeCategory(c) ? c : 'ingresos';
      byIngCat[ingKey] = (byIngCat[ingKey] || 0) + t.amount;
    } else {
      gastos += Math.abs(t.amount);
      const c = t.cat || 'otros';
      // Keep category as-is — ing_boda and ing_bizum can be both income and expense
      byCat[c] = (byCat[c] || 0) + Math.abs(t.amount);
    }
  }
  const ahorro = ingresos - gastos;
  const tasa = ingresos > 0 ? (ahorro / ingresos) * 100 : 0;
  return { ingresos, gastos, ahorro, tasa, byCat, byIngCat, txns };
}

function filterExcluded(txns) {
  if (!state.excludedCats || state.excludedCats.length === 0) return txns;
  return txns.filter(t => !state.excludedCats.includes(t.cat));
}

function getStats(key, ownerFilter) {
  const data = state.months[key] || { transactions: [] };
  const filter = ownerFilter !== undefined ? ownerFilter : state.ownerFilter;
  const txns = filterExcluded(filterTxnsByOwner(data.transactions, filter));
  return calcStats(txns);
}

function getPeriodoStats(ownerFilter) {
  const filter = ownerFilter !== undefined ? ownerFilter : state.ownerFilter;
  const allTxns = filterExcluded(getAllMonthKeys().flatMap(k =>
    filterTxnsByOwner(state.months[k]?.transactions || [], filter)
  ));
  return calcStats(allTxns);
}

// Returns stats for current view (mes or todo)
function getCurrentStats() {
  if (state.periodoView === 'todo') return getPeriodoStats();
  return getStats(getCurrentKey());
}

function getAllMonthKeys() {
  return Object.keys(state.months).sort();
}

  return new Intl.NumberFormat('es-ES', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n);
}
function fmtDec(n) {

function renderBalance() {
  const allKeys = getAllMonthKeys().sort();
  const viewMode = state.balanceView || 'total'; // 'total' | 'mes'
  const selKey   = state.balanceMonth || getCurrentKey();

  // Current balances (as of file download date)
  const currentBalances = {};
  ACCOUNTS.forEach(a => { currentBalances[a.id] = a.balance || 0; });
  const totalCurrent = ACCOUNTS.reduce((s,a) => s + (a.balance||0), 0);

  // Per-period stats: for each month and each account
  function getAccStats(accId, key) {
    const txns = (state.months[key]?.transactions || []).filter(t => t.account === accId);
    const ing  = txns.filter(t => t.amount > 0).reduce((s,t) => s+t.amount, 0);
    const gas  = txns.filter(t => t.amount < 0).reduce((s,t) => s+Math.abs(t.amount), 0);
    return { ing, gas, net: ing - gas, n: txns.length };
  }

  // Total period stats per account
  function getAccTotal(accId) {
    return allKeys.reduce((acc, k) => {
      const s = getAccStats(accId, k);
      return { ing: acc.ing+s.ing, gas: acc.gas+s.gas, net: acc.net+s.net, n: acc.n+s.n };
    }, { ing:0, gas:0, net:0, n:0 });
  }

  // Build display data
  const isTotal = viewMode === 'total';
  const displayKeys = isTotal ? allKeys : [selKey];

  const accRows = ACCOUNTS.map(acc => {
    const s = isTotal ? getAccTotal(acc.id) : getAccStats(acc.id, selKey);
    return { acc, ...s };
  });

  const totalIng = accRows.reduce((s,r) => s+r.ing, 0);
  const totalGas = accRows.reduce((s,r) => s+r.gas, 0);
  const totalNet = totalIng - totalGas;

  const periodLabel = isTotal
    ? (allKeys.length > 0 ? `${allKeys[0]} → ${allKeys[allKeys.length-1]}` : 'Sin datos')
    : selKey;

  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <div style="display:flex;gap:4px;background:var(--bg3);border-radius:var(--r2);padding:3px">
        <button class="tab ${isTotal?'active':''}" onclick="setBalanceView('total')" style="flex:none;padding:6px 16px">Todo el periodo</button>
        <button class="tab ${!isTotal?'active':''}" onclick="setBalanceView('mes')" style="flex:none;padding:6px 16px">Por mes</button>
      </div>
      ${!isTotal ? `
      <select onchange="setBalanceMonth(this.value)" style="padding:6px 12px;font-size:13px">
        ${allKeys.map(k => `<option value="${k}" ${k===selKey?'selected':''}>${MONTHS_ES[parseInt(k.slice(5))-1]} ${k.slice(0,4)}</option>`).join('')}
      </select>` : ''}
    </div>

    <!-- Saldo actual total -->
    <div class="goal-card" style="margin-bottom:20px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em">Patrimonio neto actual</div>
      <div style="font-size:36px;font-weight:600;font-family:var(--mono);letter-spacing:-1px;color:${totalCurrent>=0?'var(--green)':'var(--red)'}">${fmt(totalCurrent)}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">Saldo real a fecha de descarga de archivos · <span style="color:var(--accent2);cursor:pointer" onclick="editBalances()">Actualizar saldos ✏️</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
        ${ACCOUNTS.map(a => `
          <div style="display:flex;align-items:center;gap:6px;font-size:12px">
            <span style="width:8px;height:8px;border-radius:50%;background:${a.color};flex-shrink:0"></span>
            <span style="color:var(--text2)">${a.name}</span>
            <span style="font-family:var(--mono);font-weight:500;color:${(a.balance||0)>=0?'var(--text)':'var(--red)'}">${fmt(a.balance||0)}</span>
          </div>`).join('')}
      </div>
    </div>

    <!-- Flujo del periodo seleccionado -->
    <div class="grid-3" style="margin-bottom:20px">
      <div class="card-sm">
        <div class="metric-label">Ingresos ${isTotal?'totales':'del mes'}</div>
        <div class="metric-value pos">${fmt(totalIng)}</div>
        <div class="metric-sub muted">${periodLabel}</div>
      </div>
      <div class="card-sm">
        <div class="metric-label">Gastos ${isTotal?'totales':'del mes'}</div>
        <div class="metric-value neg">${fmt(totalGas)}</div>
        <div class="metric-sub muted">${periodLabel}</div>
      </div>
      <div class="card-sm">
        <div class="metric-label">Flujo neto ${isTotal?'total':'del mes'}</div>
        <div class="metric-value" style="color:${totalNet>=0?'var(--green)':'var(--red)'}">${fmt(totalNet)}</div>
        <div class="metric-sub muted">${totalNet>=0?'Más ingresos que gastos':'Más gastos que ingresos'}</div>
      </div>
    </div>

    <!-- Detalle por cuenta -->
    <div class="card" style="margin-bottom:20px">
      <div class="card-title">Detalle por cuenta — ${isTotal?'periodo completo':periodLabel}</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${accRows.map(r => `
          <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg3);border-radius:var(--r);border-left:3px solid ${r.acc.color}">
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                <span style="font-size:14px;font-weight:500">${r.acc.name}</span>
                <span style="font-size:11px;color:var(--text3)">${r.acc.owner==='ambos'?'conjunta':r.acc.owner} · ${r.n} mov.</span>
              </div>
              <div style="display:flex;gap:16px;font-size:12px">
                <span style="color:var(--green)">↑ ${fmt(r.ing)}</span>
                <span style="color:var(--red)">↓ ${fmt(r.gas)}</span>
              </div>
            </div>
            <div style="text-align:right;flex-shrink:0">
              <div style="font-size:16px;font-weight:600;font-family:var(--mono);color:${r.net>=0?'var(--green)':'var(--red)'}">${fmt(r.net)}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px">flujo neto</div>
            </div>
            <div style="text-align:right;flex-shrink:0;padding-left:12px;border-left:1px solid var(--border)">
              <div style="font-size:16px;font-weight:600;font-family:var(--mono);color:${(r.acc.balance||0)>=0?'var(--text)':'var(--red)'}">${fmt(r.acc.balance||0)}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px">saldo actual</div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    ${!isTotal ? `
    <!-- Evolución mensual acumulada -->
    <div class="card">
      <div class="card-title">Evolución mensual — flujo neto por cuenta</div>
      <div class="chart-wrap" style="height:240px"><canvas id="balanceChart" role="img" aria-label="Flujo neto mensual por cuenta"></canvas></div>
    </div>` : `
    <!-- Totales por mes -->
    <div class="card">
      <div class="card-title">Flujo neto mensual — todas las cuentas</div>
      <div class="chart-wrap" style="height:240px"><canvas id="balanceChart" role="img" aria-label="Flujo neto total por mes"></canvas></div>
    </div>`}
  `;

  // Chart
  if (isTotal) {
    const labels = allKeys.map(k => MONTHS_ES[parseInt(k.slice(5))-1].slice(0,3) + ' ' + k.slice(2,4));
    const data   = allKeys.map(k => {
      const txns = state.months[k]?.transactions || [];
      const ing  = txns.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
      const gas  = txns.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
      return Math.round(ing - gas);
    });
    new Chart(document.getElementById('balanceChart'), {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: data.map(v=>v>=0?'rgba(62,207,142,0.6)':'rgba(248,113,113,0.6)'), borderRadius: 4 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
        scales:{ x:{grid:{display:false},ticks:{color:'#5a5a72',font:{size:11}}}, y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5a5a72',font:{size:11},callback:v=>v+'€'}} } }
    });
  } else {
    const labels = allKeys.map(k => MONTHS_ES[parseInt(k.slice(5))-1].slice(0,3) + ' ' + k.slice(2,4));
    const datasets = ACCOUNTS.map(acc => ({
      label: acc.name,
      data: allKeys.map(k => Math.round(getAccStats(acc.id, k).net)),
      borderColor: acc.color,
      backgroundColor: acc.color + '22',
      borderWidth: 2, fill: false, tension: 0.3, pointRadius: 3
    }));
    new Chart(document.getElementById('balanceChart'), {
      type: 'line',
      data: { labels, datasets },
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#9090a8', font:{size:11}, boxWidth:12 } } },
        scales:{ x:{grid:{display:false},ticks:{color:'#5a5a72',font:{size:11}}}, y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5a5a72',font:{size:11},callback:v=>v+'€'}} } }
    });
  }
}

window.setBalanceView = function(v) {
  state.balanceView = v;
  saveState();
  renderBalance();
};

window.setBalanceMonth = function(k) {
  state.balanceMonth = k;
  saveState();
  renderBalance();
};

// Average of last 6 months for a category
function getCatAvg(catId, isIncome) {
  const months = state.avgWindow || 6;
  const now = new Date();
  let total = 0, count = 0;
  for (let i = 1; i <= months; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const k = monthKey(d.getFullYear(), d.getMonth());
    if (!state.months[k]) continue;
    const st = getStats(k);
    const v = isIncome ? (st.byIngCat[catId] || 0) : (st.byCat[catId] || 0);
    if (v > 0) { total += v; count++; }
  }
  return count > 0 ? total / count : 0;
}
// Keep old name as alias
function getCatAvg6m(catId, isIncome) { return getCatAvg(catId, isIncome); }

// ---- RESUMEN ----
function renderResumen() {
  const isTodo = state.periodoView === 'todo';
  const s = getCurrentStats();
  const allKeys = getAllMonthKeys();
  const key = getCurrentKey();

  // For comparison: previous month (only in mes mode)
  const prevKey = !isTodo ? allKeys[allKeys.indexOf(key) - 1] : null;
  const prev = prevKey ? getStats(prevKey) : null;
  const periodoLabel = isTodo ? `${allKeys.length} meses` : MONTHS_ES[state.currentMonth] + ' ' + state.currentYear;
  const planProgress = calcPlanProgress();

  document.getElementById('content').innerHTML = `
    <div class="grid-4">
      <div class="card-sm">
        <div class="metric-label">Ingresos</div>
        <div class="metric-value">${fmt(s.ingresos)}</div>
        ${prev ? `<div class="metric-sub ${s.ingresos >= prev.ingresos ? 'pos' : 'neg'}">${s.ingresos >= prev.ingresos ? '↑' : '↓'} ${fmt(Math.abs(s.ingresos - prev.ingresos))} vs mes ant.</div>` : `<div class="metric-sub muted">${periodoLabel}</div>`}
      </div>
      <div class="card-sm">
        <div class="metric-label">Gastos</div>
        <div class="metric-value">${fmt(s.gastos)}</div>
        ${prev ? `<div class="metric-sub ${s.gastos <= prev.gastos ? 'pos' : 'neg'}">${s.gastos <= prev.gastos ? '↓' : '↑'} ${fmt(Math.abs(s.gastos - prev.gastos))} vs mes ant.</div>` : `<div class="metric-sub muted">${periodoLabel}</div>`}
      </div>
      <div class="card-sm">
        <div class="metric-label">Ahorro</div>
        <div class="metric-value" style="color:${s.ahorro >= 0 ? 'var(--green)' : 'var(--red)'}">${fmt(s.ahorro)}</div>
        <div class="metric-sub muted">Tasa: ${s.tasa.toFixed(1)}%</div>
      </div>
      <div class="card-sm">
        <div class="metric-label">Obj. plan</div>
        <div class="metric-value" style="color:var(--accent2)">${planProgress.toFixed(0)}%</div>
        <div class="metric-sub muted">${fmt(planProgress/100*state.plan.objetivo)} / ${fmt(state.plan.objetivo)}</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-title">Gastos por categoría — ${periodoLabel}</div>
        ${Object.keys(s.byCat).length === 0 ? '<div class="empty-state" style="padding:30px"><div class="empty-icon">📊</div><div>Sin movimientos</div></div>' : `
        <div class="chart-wrap" style="height:220px"><canvas id="donutChart" role="img" aria-label="Gastos por categoría"></canvas></div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px" id="legendCat"></div>`}
      </div>
      <div class="card">
        <div class="card-title">Evolución mensual</div>
        <div class="chart-wrap" style="height:220px"><canvas id="lineChart" role="img" aria-label="Evolución de gastos e ingresos"></canvas></div>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <span class="section-title">${isTodo ? 'Todos los movimientos' : 'Últimos movimientos'}</span>
        <button class="btn btn-ghost" onclick="showPage('gastos')" style="font-size:12px">Ver todos</button>
      </div>
      <div class="txn-list">
        ${renderTxnList(s.txns.slice(0, isTodo ? 12 : 8), false)}
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <div class="card-title">Balance por cuenta — ${periodoLabel}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px">
        ${ACCOUNTS.map(acc => {
          const accTxns = isTodo
            ? allKeys.flatMap(k => (state.months[k]?.transactions||[]).filter(t=>t.account===acc.id))
            : (state.months[key]?.transactions||[]).filter(t=>t.account===acc.id);
          const ing = accTxns.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0);
          const gas = accTxns.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0);
          const neto = ing - gas;
          return `<div style="padding:14px;border-radius:var(--r);border:1px solid ${acc.color}30;background:${acc.color}08">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
              <div style="width:8px;height:8px;border-radius:50%;background:${acc.color}"></div>
              <span style="font-size:13px;font-weight:500">${acc.name}</span>
              <span style="font-size:10px;color:var(--text3);margin-left:auto">${acc.owner==='ambos'?'conjunta':acc.owner}</span>
            </div>
            <div style="font-size:18px;font-weight:600;font-family:var(--mono);color:${neto>=0?'var(--green)':'var(--red)'};margin-bottom:4px">${fmt(neto)}</div>
            <div style="font-size:11px;color:var(--text3)">${accTxns.length} mov · ${fmt(gas)} gasto</div>
          </div>`;
        }).join('')}

    </div>
  `;

  // Donut chart
  if (Object.keys(s.byCat).length > 0) {
    const cats = Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
    new Chart(document.getElementById('donutChart'), {
      type: 'doughnut',
      data: { labels: cats.map(([id])=>getCat(id).name), datasets: [{ data: cats.map(([,v])=>Math.round(v)), backgroundColor: cats.map(([id])=>getCat(id).color), borderWidth: 3, borderColor: '#16161d' }] },
      options: { responsive: true, maintainAspectRatio: false, cutout: '60%', plugins: { legend: { display: false } } }
    });
    document.getElementById('legendCat').innerHTML = cats.map(([id,v]) =>
      `<div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)">
        <span style="width:9px;height:9px;border-radius:2px;background:${getCat(id).color};display:inline-block"></span>
        ${getCat(id).name} <span style="color:var(--text3);font-size:11px">${fmt(v)}</span>
      </div>`).join('');
  }

  // Bar/line chart — always show all available months
  const chartKeys = allKeys.length > 0 ? allKeys : [key];
  const chartData = chartKeys.map(k => {
    const st = getStats(k);
    return { label: MONTHS_ES[parseInt(k.slice(5))-1].slice(0,3) + ' ' + k.slice(2,4), gastos: st.gastos, ingresos: st.ingresos, ahorro: st.ahorro };
  });

  new Chart(document.getElementById('lineChart'), {
    type: 'bar',
    data: {
      labels: chartData.map(d=>d.label),
      datasets: [
        { label:'Ingresos', data: chartData.map(d=>Math.round(d.ingresos)), backgroundColor: 'rgba(124,111,247,0.5)', borderRadius: 4 },
        { label:'Gastos',   data: chartData.map(d=>Math.round(d.gastos)),   backgroundColor: 'rgba(248,113,113,0.5)', borderRadius: 4 },
        { label:'Ahorro',   data: chartData.map(d=>Math.round(d.ahorro)),   type:'line', borderColor:'#3ecf8e', backgroundColor:'rgba(62,207,142,0.1)', borderWidth:2, fill:true, tension:0.4, pointRadius:3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color:'#9090a8', font:{size:11}, boxWidth:12 } } },
      scales: {
